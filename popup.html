<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Assistant</title>
    <style>
        body {
            width: 250px;
            padding: 15px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h3 {
            margin: 0;
            font-size: 16px;
            text-align: center;
            font-weight: 600;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            background-color: #4caf50;
            color: white;
        }
        button:active {
            transform: scale(0.98);
        }
        button.stop {
            background-color: #f44336;
        }
        #status {
            font-size: 12px;
            color: #aaaaaa;
            text-align: center;
        }
        .api-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #333;
            padding-top: 15px;
            margin-top: 5px;
        }
        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 13px;
        }
        input:focus { outline: none; border-color: #4caf50; }
        #saveKeyBtn {
            background-color: #2196F3;
            padding: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h3>Interview Assistant</h3>
    <button id="toggleBtn">Start Listening</button>
    <div id="status">Status: Idle</div>
    
    <div class="api-section">
        <input type="password" id="apiKeyInput" placeholder="Enter Groq API Key">
        <button id="saveKeyBtn">Save Key</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
